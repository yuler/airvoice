name: CLI Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.4.6)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.4.6)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            APP_VERSION="${INPUT_VERSION#v}"
          else
            APP_VERSION="$(./scripts/resolve-version.sh)"
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $APP_VERSION" >&2
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CLI version: $APP_VERSION"

      - name: Build binaries
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          mkdir -p dist

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/airvoice-cli-darwin-arm64 ./cli

          # macOS AMD64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/airvoice-cli-darwin-amd64 ./cli

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/airvoice-cli-linux-arm64 ./cli

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/airvoice-cli-linux-amd64 ./cli

          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/airvoice-cli-windows-amd64.exe ./cli

      - name: Generate checksums
        run: |
          cd dist
          sha256sum airvoice-cli-* > checksums-cli.txt

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cli-binaries
          path: dist/*
          if-no-files-found: error
