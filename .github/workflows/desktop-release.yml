name: Desktop Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.4.6)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.4.6)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-latest
            arch: arm64
            artifact: macOS
          - platform: linux
            runner: ubuntu-24.04
            arch: amd64
            artifact: Linux
          - platform: windows
            runner: windows-latest
            arch: amd64
            artifact: Windows

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          # azure.archive.ubuntu.com mirrors are flaky on GitHub runners; prefer archive.ubuntu.com
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sh -c 'printf "https://archive.ubuntu.com/ubuntu/\tpriority:1\n" > /etc/apt/apt-mirrors.txt; printf "https://security.ubuntu.com/ubuntu/\tpriority:2\n" >> /etc/apt/apt-mirrors.txt'
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev desktop-file-utils

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            BASE_VERSION="$(./scripts/resolve-version.sh)"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="${BASE_VERSION}-${SHORT_SHA}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.artifact }})
        shell: bash
        env:
          AIRVOICE_VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/with-wails-version.sh wails build --platform "${PLATFORM}/${ARCH}" -tags webkit2_41

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/package-appimage.sh \
            --binary build/bin/Airvoice \
            --version "$VERSION" \
            --output-dir release

      - name: Verify Linux AppImage contents
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: |
          set -euo pipefail
          APPIMAGE=$(readlink -f release/Airvoice-Desktop-*-Linux-*.AppImage)
          test -x "$APPIMAGE"
          file "$APPIMAGE" | grep -qi 'executable\|ELF'
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          (
            cd "$VERIFY_DIR"
            APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract
            test -x squashfs-root/AppRun
            test -f squashfs-root/usr/bin/Airvoice
            find squashfs-root -name WebKitWebProcess | grep -q .
            find squashfs-root -name WebKitNetworkProcess | grep -q .
            find squashfs-root -type d \( -name 'webkit2gtk-4.0' -o -name 'webkit2gtk-4.1' \) | grep -q .
            echo "AppImage extract checks passed"
          )

      - name: Package and verify Windows ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exePath = 'build/bin/Airvoice.exe'
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows binary missing: $exePath"
          }
          $zipPath = "release/Airvoice-Desktop-$($env:VERSION)-Windows.zip"
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force

          # Verify ZIP magic header (PK\x03\x04) and extractability
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path $zipPath))[0..3]
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B -or $header[2] -ne 0x03 -or $header[3] -ne 0x04) {
            throw "Generated archive is not a valid ZIP file: $zipPath"
          }
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-windows-zip"
          if (Test-Path $verifyDir) { Remove-Item -Recurse -Force $verifyDir }
          Expand-Archive -Path $zipPath -DestinationPath $verifyDir -Force
          if (-not (Test-Path (Join-Path $verifyDir 'Airvoice.exe'))) {
            throw "Airvoice.exe missing after extracting $zipPath"
          }
          Remove-Item -Recurse -Force $verifyDir
          Write-Host "Windows ZIP archive checks passed: $zipPath"

      - name: Collect artifacts
        shell: bash
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release

          case "$PLATFORM" in
            darwin)
              if [ -d "build/bin/Airvoice.app" ]; then
                zip -r "release/Airvoice-Desktop-${VERSION}-macOS.zip" build/bin/Airvoice.app
              fi
              if [ -f "build/bin/Airvoice.dmg" ]; then
                cp build/bin/Airvoice.dmg "release/Airvoice-Desktop-${VERSION}-macOS.dmg"
              fi
              ;;
            linux)
              if ! ls release/Airvoice-Desktop-*-Linux-*.AppImage >/dev/null 2>&1; then
                echo "Expected AppImage missing in release/" >&2
                exit 1
              fi
              ;;
            windows)
              if [ ! -f "release/Airvoice-Desktop-${VERSION}-Windows.zip" ]; then
                echo "Expected Windows ZIP missing in release/" >&2
                exit 1
              fi
              if [ -f "build/bin/Airvoice-amd64.exe" ]; then
                cp build/bin/Airvoice-amd64.exe "release/Airvoice-Desktop-${VERSION}-Windows-amd64.exe"
              fi
              if [ -f "build/bin/Airvoice-${VERSION}-amd64.exe" ]; then
                cp "build/bin/Airvoice-${VERSION}-amd64.exe" "release/Airvoice-Desktop-${VERSION}-Windows-amd64.exe"
              fi
              ;;
          esac

          echo "--- Released files ---"
          find release -type f -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/release/*
          if-no-files-found: error
