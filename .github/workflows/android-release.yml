name: Android Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.4.6)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.4.6)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            BASE_VERSION="$(./scripts/resolve-version.sh)"
            VERSION="${BASE_VERSION}-$(git rev-parse --short HEAD)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/airvoice-release.keystore"

      - name: Run unit tests
        working-directory: android
        env:
          AIRVOICE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        working-directory: android
        env:
          AIRVOICE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/airvoice-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/airvoice-android-${VERSION}.apk"
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-release-apk
          path: release/*.apk
          if-no-files-found: error
