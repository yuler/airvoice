name: iOS TestFlight

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.4.6)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.4.6)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            IOS_DEVELOPMENT_TEAM \
            IOS_DISTRIBUTION_CERT_P12_BASE64 \
            IOS_DISTRIBUTION_CERT_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            APP_VERSION="${INPUT_VERSION#v}"
          else
            APP_VERSION="$(./scripts/resolve-version.sh)"
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building iOS version: $APP_VERSION"

      - name: Import signing certificate
        id: cert
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/distribution.p12"
          chmod 600 "$RUNNER_TEMP/distribution.p12"
          EXPECTED_WWDR_SHA256="dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          ACTUAL_WWDR_SHA256="$(shasum -a 256 "$RUNNER_TEMP/AppleWWDRCAG3.cer" | awk '{print $1}')"
          if [ "$ACTUAL_WWDR_SHA256" != "$EXPECTED_WWDR_SHA256" ]; then
            echo "::error::AppleWWDRCAG3.cer SHA-256 mismatch: expected ${EXPECTED_WWDR_SHA256}, got ${ACTUAL_WWDR_SHA256}" >&2
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Distribution:|iPhone Distribution:/ { print $2; exit }')"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No Apple Distribution signing identity found in imported keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          CERT_SERIAL="$(security find-certificate -c "$SIGN_IDENTITY" -p "$KEYCHAIN_PATH" | openssl x509 -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]' | sed 's/^0*//')"

          echo "sign_identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "cert_serial=$CERT_SERIAL" >> "$GITHUB_OUTPUT"
          echo "Using signing identity: $SIGN_IDENTITY"

      - name: Prepare App Store Connect API key and asc CLI
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          curl -fsSL https://asccli.sh/install | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/asc" auth login --bypass-keychain \
            --name "Airvoice CI" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch and install App Store provisioning profile
        id: signing
        shell: bash
        env:
          BUNDLE_ID: cc.yuler.airvoice
          CERT_SERIAL: ${{ steps.cert.outputs.cert_serial }}
        run: |
          set -euo pipefail
          PROFILE_ID=""
          while IFS= read -r pid; do
            [ -z "$pid" ] && continue
            MATCH="$(asc profiles view --id "$pid" --include bundleId,certificates --output json | python3 -c '
          import json, os, sys
          doc = json.load(sys.stdin)
          want_bid = os.environ["BUNDLE_ID"]
          want_serial = os.environ["CERT_SERIAL"].lstrip("0").upper()
          inc = doc.get("included", [])
          has_bid = any(i.get("type") == "bundleIds" and i.get("attributes", {}).get("identifier") == want_bid for i in inc)
          has_cert = any(
            i.get("type") == "certificates"
            and i.get("attributes", {}).get("serialNumber", "").lstrip("0").upper() == want_serial
            for i in inc
          )
          print("yes" if (has_bid and has_cert) else "no")
          ')"
            if [ "$MATCH" = "yes" ]; then
              PROFILE_ID="$pid"
              break
            fi
          done < <(asc profiles list --profile-type IOS_APP_STORE --paginate --output json | python3 -c '
          import json, sys
          for p in json.load(sys.stdin).get("data", []):
            if p.get("attributes", {}).get("profileState") == "ACTIVE":
              print(p["id"])
          ')

          if [ -z "$PROFILE_ID" ]; then
            echo "No active IOS_APP_STORE profile found for $BUNDLE_ID matching cert serial $CERT_SERIAL; creating one..."
            BUNDLE_RES_ID="$(asc bundle-ids list --paginate --output json | python3 -c '
          import json, os, sys
          want = os.environ["BUNDLE_ID"]
          for b in json.load(sys.stdin).get("data", []):
            if b.get("attributes", {}).get("identifier") == want:
              print(b["id"])
              break
          ')"
            CERT_RES_ID="$(asc certificates list --paginate --output json | python3 -c '
          import json, os, sys
          want = os.environ["CERT_SERIAL"].lstrip("0").upper()
          for c in json.load(sys.stdin).get("data", []):
            if c.get("attributes", {}).get("serialNumber", "").lstrip("0").upper() == want:
              print(c["id"])
              break
          ')"
            if [ -z "$BUNDLE_RES_ID" ] || [ -z "$CERT_RES_ID" ]; then
              echo "::error::Failed to resolve Bundle ID ($BUNDLE_RES_ID) or Distribution certificate ($CERT_RES_ID) in App Store Connect"
              exit 1
            fi
            PROFILE_ID="$(asc profiles create \
              --name "Airvoice App Store ${CERT_SERIAL:0:8}" \
              --profile-type IOS_APP_STORE \
              --bundle "$BUNDLE_RES_ID" \
              --certificate "$CERT_RES_ID" \
              --output json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print((d[0] if isinstance(d, list) else d)["id"])')"
          fi

          PROFILE_PATH="$RUNNER_TEMP/AppStore.mobileprovision"
          asc profiles download --id "$PROFILE_ID" --output "$PROFILE_PATH" --overwrite
          asc profiles local install --path "$PROFILE_PATH" --force

          PROFILE_INFO="$(asc profiles inspect --path "$PROFILE_PATH" --output json)"
          PROFILE_UUID="$(printf '%s' "$PROFILE_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["uuid"])')"
          PROFILE_NAME="$(printf '%s' "$PROFILE_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')"

          echo "Installed App Store profile: $PROFILE_NAME ($PROFILE_UUID)"
          {
            echo "bundle_id=$BUNDLE_ID"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing config and ExportOptions
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign_identity }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          cat > ios/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${IOS_DEVELOPMENT_TEAM}
          CODE_SIGN_IDENTITY = ${SIGN_IDENTITY}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_UUID}
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode project
        env:
          AIRVOICE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/ios-xcodegen.sh

      - name: Archive and export IPA
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign_identity }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Airvoice.xcodeproj \
            -scheme Airvoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Airvoice.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Airvoice.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/export/Airvoice.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::Expected exported IPA at $IPA_PATH"
            ls -la "$RUNNER_TEMP/export" || true
            exit 1
          fi

          APP_TARGET="${ASC_APP_ID:-$BUNDLE_ID}"
          for attempt in 1 2 3; do
            if asc builds upload \
              --app "$APP_TARGET" \
              --ipa "$IPA_PATH" \
              --platform IOS; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload $IPA_PATH to App Store Connect after 3 attempts"
              exit 1
            fi
            echo "::warning::asc builds upload attempt ${attempt}/3 failed; retrying in 15s..."
            sleep 15
          done

      - name: Clean up signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            "$RUNNER_TEMP/AppStore.mobileprovision" \
            "$HOME/.asc"
