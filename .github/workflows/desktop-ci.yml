name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci --prefix frontend
          mkdir -p frontend/dist
          printf '%s\n' '<!doctype html><html></html>' > frontend/dist/index.html
          wails generate module
          npm run build --prefix frontend

      - name: Run desktop tests
        run: go test -v ./desktop/...

  build:
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install Linux dependencies
        run: |
          # azure.archive.ubuntu.com mirrors often hang on GitHub runners; use archive.ubuntu.com
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Build
        working-directory: desktop
        run: wails build --platform linux/amd64
