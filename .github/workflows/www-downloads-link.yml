name: Sync WWW Downloads

# After CLI / Desktop / Android release workflows finish, check whether all
# platform assets exist on the GitHub Release, then deploy www (download URLs
# come from the repo-root VERSION file).
on:
  workflow_run:
    workflows:
      - CLI Release
      - Desktop Release
      - Android Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.3.2)'
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-www-downloads-${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG=$(git tag --points-at "$SHA" | grep '^v' | head -1 || true)
          fi

          if [ -z "$TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release tag found, skipping."
            exit 0
          fi

          VERSION="${TAG#v}"
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not match VERSION file ($FILE_VERSION), skipping."
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Check release assets
        id: assets
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          REQUIRED=(
            "airvoice-cli-darwin-arm64"
            "airvoice-cli-darwin-amd64"
            "airvoice-cli-linux-amd64"
            "airvoice-cli-windows-amd64.exe"
            "Airvoice-Desktop-${VERSION}-macOS.zip"
            "Airvoice-Desktop-${VERSION}-Linux-x86_64.AppImage"
            "Airvoice-Desktop-${VERSION}-Windows.zip"
            "airvoice-android-${VERSION}.apk"
          )

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ -z "$ASSETS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not found or has no assets yet."
            exit 0
          fi

          MISSING=0
          for asset in "${REQUIRED[@]}"; do
            if ! echo "$ASSETS" | grep -qxF "$asset"; then
              echo "Missing asset: $asset"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "$MISSING asset(s) still missing; waiting for other platform releases."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required release assets are present."
          fi

      - name: Trigger WWW Deploy
        if: steps.meta.outputs.skip != 'true' && steps.assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run www-deploy.yml --ref main
